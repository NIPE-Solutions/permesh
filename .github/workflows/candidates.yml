name: Native candidates
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
concurrency:
  group: candidates-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            binary: permesh
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: permesh
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: permesh
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: permesh
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            binary: permesh.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Verify native host
        shell: bash
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          rustc +stable -vV
          test "$(rustc +stable -vV | sed -n 's/^host: //p')" = "$EXPECTED_TARGET"
      - name: Test native workspace
        run: cargo +stable test --workspace --locked --target ${{ matrix.target }}
      - name: Test candidate packaging
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Build native candidate
        run: cargo +stable build --release --locked --package permesh-cli --bin permesh --target ${{ matrix.target }}
      - name: Smoke synthetic demo
        run: python scripts/smoke_candidate.py target/${{ matrix.target }}/release/${{ matrix.binary }}
      - name: Package allowlisted candidate files
        shell: bash
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          python scripts/package_candidate.py --target '${{ matrix.target }}' --version "$version" --output candidate-output
      - name: Retain unsigned candidate, dependency inventory and checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: permesh-candidate-${{ matrix.target }}-${{ github.sha }}
          path: |
            candidate-output/*.tar.gz
            candidate-output/*.zip
            candidate-output/*.sha256
            candidate-output/*.dependencies.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          include-hidden-files: false
