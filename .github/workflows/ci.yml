name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check local documentation links
        run: python scripts/check_docs.py
      - name: Test documentation link checker
        run: python -m unittest discover -s scripts -p 'test_check_docs.py'
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Select stable Rust
        run: rustup default stable
      - run: cargo fmt --all -- --check
      - run: cargo build --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all --locked
      - name: Test Windows Credential Manager
        if: runner.os == 'Windows'
        run: cargo test -p permesh-secrets --test native --locked -- --ignored --exact native_round_trip
      - name: Install Linux Secret Service
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring dbus-x11
      - name: Test Linux Secret Service
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- bash -euo pipefail -c '
            printf "%s" "synthetic-ci-unlock" | gnome-keyring-daemon --unlock --components=secrets
            cargo test -p permesh-secrets --test native --locked -- --ignored --exact native_round_trip
          '
      - name: Test unavailable Linux Secret Service
        if: runner.os == 'Linux'
        env:
          DBUS_SESSION_BUS_ADDRESS: unix:path=/tmp/permesh-no-bus
        run: cargo test -p permesh-secrets --test native --locked -- --ignored --exact unavailable_service_is_redacted
      - run: python -m unittest discover -s examples/external-provider -p 'test_*.py'
      - name: Exercise explicit native external discovery
        run: python scripts/check_external_host.py
      - name: Exercise approved external workspace queries
        run: python scripts/check_external_queries.py
      - name: Exercise declarative provider setup
        run: python scripts/check_provider_setup.py
      - name: Validate Python-to-Rust discovery protocol
        run: python scripts/check_protocol_example.py
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.91.0 --profile minimal
      - run: cargo +1.91.0 check --workspace --all-targets --locked
