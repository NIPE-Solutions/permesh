# Review the complete workspace graph, including platform-specific dependencies.
[advisories]
# Each exception names its advisory and why it cannot be resolved yet; see docs/DEPENDENCIES.md.
ignore = [
    { id = "RUSTSEC-2026-0370", reason = "Unmaintained notice, not a vulnerability: merged into zbus 6. Reached only through keyring 4.2 -> zbus-secret-service-keyring-store 1.0 -> secret-service 5.2 -> zbus 5 on Linux; no released keyring stack uses zbus 6 yet. Remove when keyring migrates." },
    { id = "RUSTSEC-2026-0371", reason = "Unmaintained notice, not a vulnerability: merged into zbus 6. Reached only through keyring 4.2 -> zbus-secret-service-keyring-store 1.0 -> secret-service 5.2 -> zbus 5 on Linux; no released keyring stack uses zbus 6 yet. Remove when keyring migrates." },
    { id = "RUSTSEC-2026-0372", reason = "Unmaintained notice, not a vulnerability: merged into zbus 6. Reached only through keyring 4.2 -> zbus-secret-service-keyring-store 1.0 -> secret-service 5.2 -> zbus 5 on Linux; no released keyring stack uses zbus 6 yet. Remove when keyring migrates." },
]

[licenses]
confidence-threshold = 0.93
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "ISC", "Unicode-3.0", "CDLA-Permissive-2.0"]

# ZIP DEFLATE backend; reviewed upstream Zlib terms, scoped to this exact release.
[[licenses.exceptions]]
crate = "zlib-rs@0.6.7"
allow = ["Zlib"]

# Email quoted-printable encoder for SMTP notifications (ADR 0032); 0BSD is
# public-domain-equivalent with no notice requirement, scoped to this exact release.
[[licenses.exceptions]]
crate = "quoted_printable@0.5.2"
allow = ["0BSD"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Private workspace path dependencies intentionally have no registry version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
