# Scheduled Permesh access check for GitLab. Create a pipeline schedule in
# Build > Pipeline schedules. See docs/starter.md in the Permesh repository.
# Merge requests that touch people/ or profiles/ get an access plan (permesh-plan);
# the post-merge execution and verify steps run by hand (docs/access-plans.md).
#
# CI/CD variables (masked): PERMESH_GITHUB_TOKEN, PERMESH_GOOGLE_TOKEN, ... for the
# env:// references in permesh.yaml; optional PERMESH_ISSUE_TOKEN (project access
# token with api scope) to keep a review issue updated. Don't mark the provider
# variables Protected: merge request pipelines on unprotected branches would not get
# them, and permesh-plan would exit 3.
# Keep this project private: job artifacts hold the full access report.
variables:
  # A Permesh release that includes `permesh check`, and the SHA-256 of its
  # x86_64-unknown-linux-gnu archive from the release page. Update both together.
  PERMESH_VERSION: "0.1.0-alpha.4"
  PERMESH_ARCHIVE_SHA256: "REPLACE_WITH_RELEASE_ARCHIVE_SHA256"
  PERMESH_DATA_DIR: "$CI_PROJECT_DIR/.permesh-state"

stages: [check, publish]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

permesh-check:
  stage: check
  image: debian:13-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends ca-certificates curl jq unzip >/dev/null
    - archive="permesh-${PERMESH_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
    - base="https://github.com/NIPE-Solutions/permesh/releases/download/v${PERMESH_VERSION}"
    - |
      case "$PERMESH_ARCHIVE_SHA256" in
        REPLACE*) echo "Set PERMESH_ARCHIVE_SHA256 in .gitlab-ci.yml to the release archive digest." >&2; exit 1 ;;
      esac
    - curl -fsSLO "$base/$archive"
    - echo "${PERMESH_ARCHIVE_SHA256}  ${archive}" | sha256sum -c
    - mkdir -p /opt/permesh && tar -xzf "$archive" -C /opt/permesh && export PATH="/opt/permesh:$PATH"
    - sh ci/bootstrap.sh
  script:
    - |
      previous=""
      if curl -fsSL --header "JOB-TOKEN: $CI_JOB_TOKEN" -o baseline.zip \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/jobs/artifacts/$CI_DEFAULT_BRANCH/download?job=permesh-baseline"; then
        unzip -q baseline.zip && previous="--previous baseline/snapshot.json"
      else
        echo "No baseline yet; this run will not compare changes."
      fi
      set +e
      # shellcheck disable=SC2086
      permesh check --out out --policy policies/review-policy.json $previous --run-url "$CI_PIPELINE_URL"
      code=$?
      set -e
      echo "CHECK_CODE=$code" > check.env
      exit "$code"
  # Exit 6 (needs review) shows as a warning so the pipeline still succeeds and the
  # baseline advances; exit 4 (incomplete) and other failures stay red.
  allow_failure:
    exit_codes: [6]
  artifacts:
    when: always
    access: developer
    expire_in: 90 days
    paths: [out/]
    reports:
      dotenv: check.env

# Keeps the snapshot as the next baseline, only when collection completed (0 or 6).
permesh-baseline:
  stage: publish
  image: debian:13-slim
  needs: [permesh-check]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"
  script:
    - |
      if [ "$CHECK_CODE" != "0" ] && [ "$CHECK_CODE" != "6" ]; then
        echo "Collection incomplete; keeping the previous baseline." && exit 1
      fi
      mkdir -p baseline && cp out/snapshot.json baseline/
  allow_failure: true
  artifacts:
    access: developer
    expire_in: 90 days
    paths: [baseline/]

# Creates or updates one open issue labeled permesh-check with the counts-only summary.
permesh-issue:
  stage: publish
  image: debian:13-slim
  needs: [permesh-check]
  rules:
    - if: $PERMESH_ISSUE_TOKEN && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web")
      when: always
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends ca-certificates curl jq >/dev/null
    - |
      api="$CI_API_V4_URL/projects/$CI_PROJECT_ID/issues"
      auth="PRIVATE-TOKEN: $PERMESH_ISSUE_TOKEN"
      issue=$(curl -fsS --header "$auth" "$api?labels=permesh-check&state=opened" | jq -r '.[0].iid // empty')
      if [ -n "$issue" ]; then
        curl -fsS --request PUT --header "$auth" --data-urlencode "description@out/summary.md" "$api/$issue" >/dev/null
      elif [ "$CHECK_CODE" != "0" ]; then
        curl -fsS --request POST --header "$auth" --data-urlencode "title=Permesh access check needs review" \
          --data-urlencode "labels=permesh-check" --data-urlencode "description@out/summary.md" "$api" >/dev/null
      fi

# Plans access changes in merge requests: counts-only summary in the job log, full
# plans as an artifact (the review copy). Plans are data; a person carries out each step.
permesh-plan:
  stage: check
  image: debian:13-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [people/**, profiles/**]
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends ca-certificates curl git jq unzip >/dev/null
    - archive="permesh-${PERMESH_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
    - base="https://github.com/NIPE-Solutions/permesh/releases/download/v${PERMESH_VERSION}"
    - |
      case "$PERMESH_ARCHIVE_SHA256" in
        REPLACE*) echo "Set PERMESH_ARCHIVE_SHA256 in .gitlab-ci.yml to the release archive digest." >&2; exit 1 ;;
      esac
    - curl -fsSLO "$base/$archive"
    - echo "${PERMESH_ARCHIVE_SHA256}  ${archive}" | sha256sum -c
    - mkdir -p /opt/permesh && tar -xzf "$archive" -C /opt/permesh && export PATH="/opt/permesh:$PATH"
    - sh ci/bootstrap.sh
  script:
    - git fetch --depth=1 origin "$CI_MERGE_REQUEST_DIFF_BASE_SHA"
    - git worktree add ../base "$CI_MERGE_REQUEST_DIFF_BASE_SHA"
    - |
      set +e
      permesh access review --base ../base --out plans
      code=$?
      set -e
      [ -f plans/summary.md ] && cat plans/summary.md
      exit "$code"
  artifacts:
    when: always
    access: developer
    expire_in: 30 days
    paths: [plans/]
