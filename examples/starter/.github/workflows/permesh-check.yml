# Scheduled Permesh access check. See docs: https://github.com/NIPE-Solutions/permesh/blob/main/docs/starter.md
name: Permesh check
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  actions: read
concurrency:
  group: permesh-check
  cancel-in-progress: false
env:
  # A Permesh release that includes `permesh check`, and the SHA-256 of its
  # x86_64-unknown-linux-gnu archive from the release page. Update both together.
  PERMESH_VERSION: "0.1.0-alpha.4"
  PERMESH_ARCHIVE_SHA256: "REPLACE_WITH_RELEASE_ARCHIVE_SHA256"
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Permesh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$PERMESH_ARCHIVE_SHA256" in
            REPLACE*) echo "Set PERMESH_ARCHIVE_SHA256 in this workflow to the release archive digest." >&2; exit 1 ;;
          esac
          archive="permesh-${PERMESH_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          gh release download "v${PERMESH_VERSION}" -R NIPE-Solutions/permesh -p "$archive"
          # The committed digest pins the exact bytes; provenance pins who built them.
          echo "${PERMESH_ARCHIVE_SHA256}  ${archive}" | sha256sum -c
          gh attestation verify "$archive" --repo NIPE-Solutions/permesh \
            --cert-identity "https://github.com/NIPE-Solutions/permesh/.github/workflows/attested-candidates.yml@refs/heads/main" \
            --predicate-type https://slsa.dev/provenance/v1 --deny-self-hosted-runners
          mkdir -p "$RUNNER_TEMP/permesh-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/permesh-bin"
          echo "$RUNNER_TEMP/permesh-bin" >> "$GITHUB_PATH"
          echo "PERMESH_DATA_DIR=$RUNNER_TEMP/permesh-state" >> "$GITHUB_ENV"
      - name: Trust and approve pinned providers
        run: sh ci/bootstrap.sh
      - name: Fetch the previous baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Accept only baselines from this workflow, on the default branch, built in
          # this repository (never from forks or other branches). Newest first.
          default_branch=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch) || default_branch=""
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=permesh-baseline&per_page=100" \
            --jq ".artifacts[] | select(.expired == false
              and .workflow_run.head_branch == \"${default_branch}\"
              and .workflow_run.head_repository_id == .workflow_run.repository_id)
              | \"\\(.id) \\(.workflow_run.id)\"" > candidates.txt 2>/dev/null || : > candidates.txt
          while read -r artifact run; do
            workflow=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run}" --jq .path) || continue
            [ "$workflow" = ".github/workflows/permesh-check.yml" ] || continue
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact}/zip" > baseline.zip || continue
            mkdir -p baseline && unzip -qo baseline.zip -d baseline && break
          done < candidates.txt
          [ -f baseline/snapshot.json ] || echo "No usable baseline; this run will not compare changes."
      - name: Run check
        id: check
        env:
          # Map each credential reference in permesh.yaml (env://NAME) to a repository secret.
          PERMESH_GITHUB_TOKEN: ${{ secrets.PERMESH_GITHUB_TOKEN }}
          PERMESH_GOOGLE_TOKEN: ${{ secrets.PERMESH_GOOGLE_TOKEN }}
          # Google refresh mode (weekly CI): client secret and refresh token.
          PERMESH_GOOGLE_CLIENT_SECRET: ${{ secrets.PERMESH_GOOGLE_CLIENT_SECRET }}
          PERMESH_GOOGLE_REFRESH_TOKEN: ${{ secrets.PERMESH_GOOGLE_REFRESH_TOKEN }}
          PERMESH_SLACK_WEBHOOK: ${{ secrets.PERMESH_SLACK_WEBHOOK }}
        run: |
          set +e
          previous=""
          [ -f baseline/snapshot.json ] && previous="--previous baseline/snapshot.json"
          # shellcheck disable=SC2086
          permesh check --out out --policy policies/review-policy.json $previous \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Keep the full report (sensitive)
        if: always() && hashFiles('out/check.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: permesh-check-${{ github.run_id }}
          path: out/
          retention-days: 90
      - name: Keep the baseline for the next run
        if: steps.check.outputs.code == '0' || steps.check.outputs.code == '6'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: permesh-baseline
          path: out/snapshot.json
          retention-days: 90
      - name: Update the review issue (counts only)
        if: always() && hashFiles('out/summary.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.check.outputs.code }}
        run: |
          issue=$(gh issue list --label permesh-check --state open --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --body-file out/summary.md
          elif [ "$CODE" != "0" ]; then
            gh label create permesh-check --color B60205 --description "Permesh access check" 2>/dev/null || true
            gh issue create --title "Permesh access check needs review" --label permesh-check --body-file out/summary.md
          fi
      - name: Report result
        if: always()
        env:
          CODE: ${{ steps.check.outputs.code }}
        run: exit "${CODE:-5}"
