[workspace]
resolver = "3"
members = ["crates/permesh-core", "crates/permesh-config", "crates/permesh-secrets", "crates/permesh-provider-sdk", "crates/permesh-provider-protocol", "crates/permesh-provider-external", "crates/permesh-cli", "crates/providers/permesh-provider-demo"]

[workspace.package]
version = "0.1.0-alpha.2"
edition = "2024"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/NIPE-Solutions/permesh"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "net", "io-util", "test-util"] }
clap = { version = "4.6", features = ["derive"] }
clap_complete = { version = "4.6.9", default-features = false }
serde-saphyr = "1.2"
keyring = "4.2"
secrecy = "0.10"
rpassword = "7"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query"] }
time = { version = "0.3", features = ["formatting", "serde", "parsing"] }
tempfile = "3"
permesh-core = { path = "crates/permesh-core" }
permesh-config = { path = "crates/permesh-config" }
permesh-secrets = { path = "crates/permesh-secrets" }
permesh-provider-sdk = { path = "crates/permesh-provider-sdk" }
permesh-provider-external = { path = "crates/permesh-provider-external" }
permesh-provider-demo = { path = "crates/providers/permesh-provider-demo" }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
strip = true
